# The tool audits itself with itself.
#
# `npm ci` rather than `npm install` on purpose: ci refuses to proceed when
# package.json and package-lock.json disagree. With zero dependencies the
# lockfile is nearly empty, and that is exactly what makes it useful — it is a
# positive assertion that there are no dependencies, and any commit that quietly
# adds one fails here instead of shipping.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The active LTS, and the floor declared in engines. One version on
        # purpose: this package has no dependencies and no native code, so a
        # matrix bought very little and cost a second way for the build to be
        # red. `engines` stays a floor rather than a pin, so 26 still installs.
        node: ['24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      # The audit reads proof, it does not produce it. Proof comes from actually
      # running the example's tests, and what that writes
      # (.spec/verification/*.json) is generated, not committed — it is stamped
      # with a git revision, so a committed copy would be stale on the next
      # commit. A checkout therefore starts with no proof, and auditing it
      # without verifying first is guaranteed to fail G5. Verify, then audit.
      #
      # ADP_TRUST_TEST_COMMAND is the consent gate's documented CI escape hatch:
      # verify executes a command out of the project's own config, so it refuses
      # to run until a human approves it. Here the repository is the approval.
      # It is set on this step alone, never in an npm script, so that nothing a
      # contributor runs locally can grant itself execution.
      - name: Audit the example project
        env:
          ADP_TRUST_TEST_COMMAND: '1'
        run: |
          npm run example:verify
          npm run example

      - name: Supply-chain and consent invariants
        run: node --test "test/supply-chain.test.js" "test/trust.test.js"

      - name: Payload manifest is current
        run: node scripts/build-manifest.js --check

      # The tarball is checked by the supply-chain invariants above, which read
      # what `npm pack` reports and compare it to an expectation. The step that
      # used to live here ran the same command and discarded the output, so it
      # passed no matter what was in the package.
